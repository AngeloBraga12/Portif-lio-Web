name: DevTrack CI

on:
  push:
    paths:
      - 'devtrack/**'
      - '.github/workflows/devtrack.yml'
  pull_request:
    paths:
      - 'devtrack/**'
      - '.github/workflows/devtrack.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: devtrack

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: devtrack/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
